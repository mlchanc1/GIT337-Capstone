<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Made by Maddy to inquire about a custom banner or graphic design project.">
    <title>Contact | Made by Maddy</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header>
        <h1>Made by Maddy</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main id="main-content">
        <h2>Contact</h2>
       <p>Interested in a custom project? Fill out the form below to tell me what you're looking for.</p>

<p id="form-instructions">
    All fields are required. If a field is incomplete or invalid, correct the highlighted field and try again.
</p>

<form aria-describedby="form-instructions">
    <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div>
        <label for="project">What can I help you with?</label>
        <select id="project" name="project" required>
            <option value="">Choose a service</option>
            <option value="banner">Custom Hand-Painted Banner</option>
            <option value="graphic-design">Graphic Design</option>
        </select>
    </div>

    <div>
        <label for="details">Project Details</label>
        <textarea id="details" name="details" rows="5" required></textarea>
    </div>

    <button type="submit">Submit Inquiry</button>
</form>
        
    </main>

    <footer>
        <p>&copy; 2026 Made by Maddy</p>
    </footer>
</body>
</html>
